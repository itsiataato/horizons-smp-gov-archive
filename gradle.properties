# Build runs on the system Gradle install (9.x). No wrapper, no Maven.
# 2 GB, not 3 GB: this host has limited RAM and a Minecraft client may be running.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=1.21.1
# 21.1.259 is the newest 1.21.1 NeoForge present in the local Gradle cache,
# so an offline build resolves without downloading a different version.
neo_version=21.1.259

mod_id=gov
mod_name=Gov
mod_group=com.horizonssmp
mod_version=1.0.1
